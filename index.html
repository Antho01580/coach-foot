<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12287a">
<meta name="mobile-web-app-capable" content="yes">
<title>Coach Foot</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<style>
:root{--g:#1d3fa6;--g2:#e4ebfb;--ok:#15803d;--ok2:#e3f5e9;--red:#e2463f;--r:#c62828;--r2:#fdecea;--o:#e67e00;--o2:#fff3e0;--b:#e2463f;--b2:#fde8e6;--bg:#f2f4f9;--t:#1a1f1c;--m:#6b7570;--l:#dde3df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:16px;padding-bottom:84px}
header{background:linear-gradient(100deg,#12287a,#1d4fc0);display:flex;align-items:center;gap:10px;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));font-weight:700;font-size:19px;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:640px;margin:0 auto}
h3{margin:18px 4px 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--m)}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 0}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--l);border-radius:10px;font:inherit;color:var(--t);background:#fff}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;background:var(--g);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:10px}
.btn.match,.btn.blue{background:var(--b)}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--l)}
.btn.red{color:var(--r)}
.btn.sm{padding:7px 10px;font-size:14px}
.btn.wa{background:#25d366}
.btn.mail{background:#12287a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.row2 .btn.big{margin-top:0}
.bar{display:flex;justify-content:space-between;margin-bottom:10px;gap:8px}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--g2);color:var(--g)}
.badge.match{background:var(--b2);color:var(--b)}
.ev{cursor:pointer}
.sub{color:var(--m);font-size:14px;margin-top:4px}
.cnt,.sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14px;font-weight:600}
.sum{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.p{color:var(--ok)}.a{color:var(--r)}.e{color:var(--o)}.n{color:var(--m)}
.seg{display:flex;background:#eef1ef;border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font:inherit;font-weight:600;color:var(--m);font-size:15px}
.seg button.on{background:#fff;color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.big{margin:4px 0 12px}
.pl{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:6px;border-left:5px solid var(--l)}
.pl.P{border-left-color:var(--ok)}.pl.A{border-left-color:var(--r);background:var(--r2)}.pl.E{border-left-color:var(--o);background:var(--o2)}
.nm{font-weight:600}
.pb{display:flex;gap:6px}
.pb button{width:46px;height:42px;border-radius:10px;border:1px solid var(--l);background:#fff;font-size:18px;font-weight:700;color:var(--m)}
.pb .P.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.pb .A.on{background:var(--r);color:#fff;border-color:var(--r)}
.pb .E.on{background:var(--o);color:#fff;border-color:var(--o)}
.th{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.th:first-child{margin-top:0}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ck{display:flex;align-items:center;gap:8px;margin:0;padding:10px;border:1px solid var(--l);border-radius:10px;color:var(--t);font-size:15px}
.ck input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--g)}
.ck.on{background:var(--g2);border-color:var(--g)}
.ck small{color:var(--m)}
.hint{background:var(--o2);border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
.info{background:var(--b2);border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
.empty{text-align:center;color:var(--m);padding:30px 0}
.prow{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.st{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.pct{font-size:22px;font-weight:800;min-width:64px;text-align:right}
.good{color:var(--ok)}.mid{color:var(--o)}.bad{color:var(--r)}
.det{font-size:13px;color:var(--m);margin-top:3px}
.bar2{height:6px;border-radius:3px;background:#eef1ef;margin-top:8px;overflow:hidden}
.bar2 i{display:block;height:100%}
.hist{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef1ef;font-size:15px}
/* calendrier */
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calh b{font-size:18px}
.calh button{border:0;background:#eef1ef;border-radius:10px;width:44px;height:40px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{border:0;background:none;font:inherit;font-weight:700;color:var(--m);padding:6px 0;font-size:13px;border-radius:8px}
.multi .dow{color:var(--b);background:var(--b2)}
.day{border:0;background:#f4f6f5;border-radius:10px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-weight:600;color:var(--t);padding:0}
.day.past{color:#9aa39e}
.day.today{box-shadow:inset 0 0 0 2px var(--g)}
.day.sel{background:var(--g);color:#fff}
.day.pick{background:var(--b);color:#fff}
.dots{display:flex;gap:3px;height:7px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g)}
.dot.match{background:var(--b)}
.day.sel .dot,.day.pick .dot{background:#fff}
.legend{display:flex;gap:14px;font-size:13px;color:var(--m);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--l);background:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;color:var(--t)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.tag{font-size:12px;background:#eef1ef;border-radius:8px;padding:3px 7px;color:var(--m)}
/* messages */
.rc{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef1ef;gap:6px}
.rc.done .nm{color:var(--ok)}
.rc.done .nm::after{content:" ✔"}
.rcb{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.rcb .btn{padding:7px 9px;font-size:13px}
.miss{color:var(--r);font-size:13px}
/* compte rendu + stats */
.mic{background:var(--r);width:100%;padding:16px;font-size:17px;margin-top:10px}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.score{display:grid;grid-template-columns:1fr 64px 16px 64px;gap:6px;align-items:center;margin-top:10px}
.score input{text-align:center;font-size:20px;font-weight:700;margin:0;padding:10px 4px}
.score span{text-align:center;font-weight:700}
.res{font-weight:800;font-size:13px;padding:2px 7px;border-radius:8px;margin-left:4px}
.res.V{background:var(--ok2);color:var(--ok)}.res.N{background:#eef1ef;color:var(--m)}.res.D{background:var(--r2);color:var(--r)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:26px;font-weight:800}
.kpi>span{font-size:13px;color:var(--m)}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px;border-bottom:1px solid var(--l)}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--m)}
.chart i{display:block;width:100%;max-width:26px;border-radius:5px 5px 0 0;background:var(--g)}
.chart i.match{background:var(--b)}
.xl{display:flex;gap:4px;font-size:10px;color:var(--m)}
.xl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.hrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.hrow span:first-child{width:90px}
.hrow .bar2{flex:1;margin:0;height:10px;border-radius:5px}
.hrow b{width:44px;text-align:right}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.rp{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eef1ef;gap:6px}
.rp.nc .nm{color:var(--o)}
.rpb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rpb button{border:1px solid var(--l);background:#fff;border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;font-weight:600;color:var(--m);min-width:40px}
.rpb button.on{background:var(--tc,var(--o));border-color:var(--tc,var(--o));color:#fff}
summary{cursor:pointer;padding:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font:inherit;font-size:12px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px}
nav button.on{color:var(--g);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><img id="logo" alt="" style="width:40px;height:40px;border-radius:50%;background:#fff;object-fit:contain;flex:none"><span id="title" style="line-height:1.15">Coach Foot</span></header>
<main id="app"></main>
<nav id="tabs">
  <button data-act="tab" data-tab="events"><span>📅</span>Planning</button>
  <button data-act="tab" data-tab="players"><span>👥</span>Joueurs</button>
  <button data-act="tab" data-tab="stats"><span>📊</span>Présence %</button>
  <button data-act="tab" data-tab="settings"><span>⚙️</span>Réglages</button>
</nav>
<div id="toast"></div>
<script>
const KEY = 'coachfoot_v1';
const DEF = () => ({ players: [], events: [], settings: { club: 'Olympique Villefontaine', cat: 'U6', sig: 'Le Coach.', equip: 'protège-tibias + gourde', mail: '', resp: 'Nathalie', respMail: '', respTel: '', waLink: '', logo: '' } });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEF(); } catch (e) { S = DEF(); }
S.settings = { ...DEF().settings, ...S.settings };
if (!S.settings.club) S.settings.club = 'Olympique Villefontaine';
const respName = () => S.settings.resp || 'la responsable';
const clubName = () => [S.settings.club, S.settings.cat].filter(Boolean).join(' ');
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => parse(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parse(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const hh = t => t ? t.replace(/^0(\d)/, '$1').replace(':', 'h').replace(/h00$/, 'h') : '';
const newTeam = (lieu = '', ko = '') => ({ id: uid(), kind: 'plateau', name: '', adv: '', dom: 'dom', lieu, adr: '', rdv: '', ko, conv: [] });
const kindOf = e => ((e.teams || [])[0] || {}).kind || 'match';
const MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const TODAY = iso(new Date());

let view = { tab: 'events', eventId: null, sub: 'presence', playerId: null, editPl: null, compose: null, since: '',
  month: TODAY.slice(0, 7), selDay: null, multi: false, picked: [], bulk: { type: 'seance', time: '', end: '', lieu: '' } };

const curEv = () => S.events.find(e => e.id === view.eventId);
const team = id => { for (const e of S.events) for (const t of (e.teams || [])) if (t.id === id) return t; };
const player = id => S.players.find(p => p.id === id);
const pname = id => (player(id) || {}).name || '?';
const phones = p => [p.tel, p.tel2].filter(x => x && x.trim());
const mails = p => [p.mail, p.mail2].filter(x => x && x.trim());
const cleanNum = n => n.replace(/[^\d+]/g, '');
const intl = n => { let d = cleanNum(n); if (d.startsWith('+')) return d.slice(1); if (d.startsWith('00')) return d.slice(2); if (d.startsWith('0')) return '33' + d.slice(1); return d; };

function roster(e) {
  if (e.type === 'match') {
    const ids = new Set();
    (e.teams || []).forEach(t => t.conv.forEach(i => ids.add(i)));
    if (ids.size) { Object.keys(e.presence).forEach(i => ids.add(i)); return S.players.filter(p => ids.has(p.id)); }
  }
  return S.players;
}
function counts(e) {
  const c = { P: 0, A: 0, E: 0, N: 0 };
  roster(e).forEach(p => c[e.presence[p.id] || 'N']++);
  return c;
}
const lab = e => e && e.type === 'match' ? 'le ' + kindOf(e) : 'la séance';
const quand = e => cap(fmtDate(e.date)) + (e.time ? ' à ' + hh(e.time) : '') + (e.lieu ? ' (' + e.lieu + ')' : '');

/* ---------- MESSAGES ---------- */
function quandRel(d) {
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  if (d === TODAY) return 'd\'aujourd\'hui (' + fmtDate(d) + ')';
  if (d === iso(tm)) return 'de demain (' + fmtDate(d) + ')';
  return 'du ' + fmtDate(d);
}
function msg(e, t) {
  const kind = t.kind || 'match';
  const players = S.players.filter(p => t.conv.includes(p.id));
  let m = `Bonjour à tous,\n\nPour le ${kind}${t.name ? ' (' + t.name + ')' : ''} ${quandRel(e.date)} ⚽`;
  if (t.adv) m += `\n${kind === 'match' ? '🆚 Contre' : '🆚 Avec'} ${t.adv}${kind === 'match' ? (t.dom === 'ext' ? ' (à l\'extérieur)' : ' (à domicile)') : ''}`;
  m += '\n';
  if (t.rdv) m += `\n🕘 Rendez-vous ${hh(t.rdv)} sur place`;
  if (t.ko) m += `\n⏱️ Début ${hh(t.ko)}`;
  if (t.edu) m += `\n👤 Éducateur : ${t.edu}`;
  if (S.settings.equip) m += `\n🎒 Avec ${S.settings.equip}`;
  if (t.lieu || t.adr) {
    m += `\n\n📍 L'adresse :${t.lieu ? '\n' + t.lieu : ''}${t.adr ? '\n' + t.adr : ''}`;
    m += `\n🗺️ https://maps.google.com/?q=${encodeURIComponent([t.lieu, t.adr].filter(Boolean).join(' '))}`;
  }
  m += `\n\nLes joueurs retenus sont :\n${players.map((p, i) => (i + 1) + ' ' + p.name).join('\n') || '(à compléter)'}`;
  m += `\n\nMerci de prévenir au plus vite en cas d'absence.`;
  if (S.settings.sig) m += `\n${S.settings.sig}`;
  return m;
}
function tpl(kind, e) {
  const sig = S.settings.sig ? '\n\n' + S.settings.sig : '';
  if (!e) return `Bonjour,\n\n${sig}`;
  if (kind === 'abs') return `Bonjour,\n\n{nom} n'était pas présent(e) à ${lab(e)} du ${cap(fmtDate(e.date))}.\nTout va bien ? Merci de me prévenir à l'avance en cas d'absence 🙏${sig}`;
  if (kind === 'cancel') return `Bonjour,\n\n⚠️ ${cap(lab(e))} du ${quand(e)} est ANNULÉ${e.type === 'match' ? '' : 'E'}.${sig}`;
  if (kind === 'info') return `Bonjour,\n\nPetite info pour ${lab(e)} du ${quand(e)} :\n\n${sig}`;
  if (kind === 'cr') {
    const sc = e.type === 'match' ? (e.teams || []).filter(t => t.bp !== '' && t.bp != null && t.bc !== '' && t.bc != null)
      .map(t => `⚽ ${t.name ? t.name + ' : ' : ''}${clubName() || 'Nous'} ${t.bp} – ${t.bc} ${t.adv || 'adversaire'}${t.buts ? '\n🥅 Buteurs : ' + t.buts : ''}`).join('\n') : '';
    return `Bonjour,\n\n📝 Compte rendu ${e.type === 'match' ? 'du match' : 'de la séance'} du ${cap(fmtDate(e.date))}\n${sc ? '\n' + sc + '\n' : ''}\n${e.cr || ''}${sig}`;
  }
  return `Bonjour,\n\n${sig}`;
}
function subj(kind, e) {
  const club = clubName() ? clubName() + ' – ' : '';
  if (!e) return club + 'Information';
  const d = cap(fmtShort(e.date));
  return club + ({ cr: 'Compte rendu ' + lab(e) + ' ' + d, conv: 'Convocation match ' + d, abs: 'Absence de {nom} – ' + d, cancel: 'ANNULATION ' + lab(e) + ' ' + d, info: 'Info ' + lab(e) + ' ' + d }[kind] || 'Information');
}
const fill = (txt, p) => txt.split('{nom}').join(p ? p.name : 'votre enfant');

function stats(pid) {
  const r = { s: [0, 0], m: [0, 0], conv: 0, abs: 0, exc: 0 };
  S.events.forEach(e => {
    if (view.since && e.date < view.since) return;
    if (e.type === 'match' && (e.teams || []).some(t => t.conv.includes(pid))) r.conv++;
    const st = e.presence[pid];
    if (!st) return;
    const k = e.type === 'match' ? 'm' : 's';
    r[k][1]++;
    if (st === 'P') r[k][0]++;
    if (st === 'A') r.abs++;
    if (st === 'E') r.exc++;
  });
  const tot = r.s[1] + r.m[1];
  r.pct = tot ? Math.round((r.s[0] + r.m[0]) / tot * 100) : null;
  return r;
}
const pc = a => a[1] ? Math.round(a[0] / a[1] * 100) + '%' : '–';
const cls = p => p === null ? 'n' : p >= 80 ? 'good' : p >= 60 ? 'mid' : 'bad';
const col = p => p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--o)' : 'var(--r)';

const hasScore = t => t.bp !== '' && t.bp != null && t.bc !== '' && t.bc != null;
const result = t => hasScore(t) ? (+t.bp > +t.bc ? 'V' : +t.bp === +t.bc ? 'N' : 'D') : null;
const resBadge = t => hasScore(t) ? ` <span class="res ${result(t)}">${t.bp}-${t.bc}</span>` : '';

/* ---------- PLANNING ---------- */
function card(e) {
  const c = counts(e);
  const sub = e.type === 'match'
    ? (e.teams || []).map(t => esc((t.name || 'Équipe') + (t.adv ? ' vs ' + t.adv : '') + (t.lieu ? ' @ ' + t.lieu : '') + (t.ko ? ' · ' + hh(t.ko) : '')) + resBadge(t)).join('<br>')
    : esc([e.time ? hh(e.time) + (e.end ? '–' + hh(e.end) : '') : '', e.lieu, e.note].filter(Boolean).join(' · '));
  const marked = c.P + c.A + c.E;
  return `<div class="card ev" data-act="openEv" data-id="${e.id}">
    <button class="btn ghost red sm" style="float:right;padding:4px 9px" data-act="delCard" data-id="${e.id}" aria-label="Supprimer">🗑️</button>
    <div><span class="badge ${e.type}">${e.type === 'match' ? cap(kindOf(e)) : 'Séance'}</span> <b>${cap(fmtDate(e.date))}</b></div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
    ${marked ? `<div class="cnt"><span class="p">✓ ${c.P}</span><span class="a">✗ ${c.A}</span><span class="e">E ${c.E}</span>${c.N ? `<span class="n">? ${c.N}</span>` : ''}</div>` : ''}
  </div>`;
}
function monthDays() {
  const [y, m] = view.month.split('-').map(Number);

/* ---------- DICTÉE ---------- */
let rec = null;
function ponctue(t) {
  return t.replace(/\s*(point à la ligne)\s*/gi, '.\n').replace(/\s*(à la ligne|nouvelle ligne)\s*/gi, '\n')
    .replace(/\s*virgule\s*/gi, ', ').replace(/\s*point d'interrogation\s*/gi, ' ? ').replace(/\s*point d'exclamation\s*/gi, ' ! ')
    .replace(/\s*\bpoint\b\s*$/gi, '. ').replace(/\s+\bpoint\b\s+/gi, '. ');
}
function dictee() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('La dictée n\'est pas disponible dans ce navigateur. Ouvre l\'appli avec Chrome, ou utilise le micro 🎤 du clavier.'); return; }
  if (rec) { rec.stop(); return; }
  const e = curEv();
  let base = e.cr ? e.cr.replace(/\s*$/, e.cr.endsWith('\n') ? '' : ' ') : '';
  rec = new SR();
  rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) {
        let t = ponctue(r[0].transcript.trim());
        if (!base || /[.!?\n]\s*$/.test(base)) t = t.charAt(0).toUpperCase() + t.slice(1);
        base += t + (t.endsWith('\n') ? '' : ' ');
      } else interim += r[0].transcript;
    }
    e.cr = base; save();
    const ta = document.getElementById('cr');
    if (ta) { ta.value = base + interim; ta.scrollTop = ta.scrollHeight; }
  };
  rec.onerror = ev => { if (ev.error === 'not-allowed') alert('Autorise le micro pour Chrome dans les réglages du téléphone.'); };
  rec.onend = () => { rec = null; const b = document.getElementById('micBtn'); if (b) { b.classList.remove('rec'); b.textContent = '🎤 Dicter à la voix'; } };
  rec.start();
  const b = document.getElementById('micBtn');
  if (b) { b.classList.add('rec'); b.textContent = '⏹️ Arrêter la dictée'; }
}

function evPct(e) { let p = 0, n = 0; Object.values(e.presence).forEach(s => { n++; if (s === 'P') p++; }); return { p, n, pct: n ? Math.round(p / n * 100) : null }; }
const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
function teamView() {
  const evs = S.events.filter(e => !view.since || e.date >= view.since).sort((a, b) => a.date.localeCompare(b.date));
  const pointed = evs.filter(e => Object.keys(e.presence).length);
  const se = pointed.filter(e => e.type === 'seance'), ma = pointed.filter(e => e.type === 'match');
  const teams = evs.filter(e => e.type === 'match').flatMap(e => (e.teams || []).filter(hasScore).map(t => ({ e, t })));
  const R = { V: 0, N: 0, D: 0 }; let bp = 0, bc = 0;
  teams.forEach(({ t }) => { R[result(t)]++; bp += +t.bp; bc += +t.bc; });
  const pS = avg(se.map(e => evPct(e).pct)), pM = avg(ma.map(e => evPct(e).pct));
  const kpi = (v, l, c = '') => `<div class="kpi"><b class="${c}">${v ?? '–'}</b><span>${l}</span></div>`;
  let h = `<div class="kpis">
    ${kpi(pS === null ? '–' : pS + '%', 'Présence moyenne en séance', pS === null ? '' : cls(pS))}
    ${kpi(pM === null ? '–' : pM + '%', 'Présence moyenne en match', pM === null ? '' : cls(pM))}
    ${kpi(se.length ? (se.reduce((x, e) => x + evPct(e).p, 0) / se.length).toFixed(1).replace('.0', '') : '–', 'Présents par séance (moyenne)')}
    ${kpi(se.length + ' / ' + ma.length, 'Séances / matchs pointés')}
  </div>`;
  if (teams.length) h += `<div class="kpis">
    ${kpi(`<span class="p">${R.V}</span>-<span class="n">${R.N}</span>-<span class="a">${R.D}</span>`, 'Victoires – Nuls – Défaites')}
    ${kpi(`${bp} / ${bc}`, `Buts marqués / encaissés (${bp - bc >= 0 ? '+' : ''}${bp - bc})`)}
  </div>`;
  const last = pointed.slice(-14);
  if (last.length) h += `<div class="card"><b>Présence par séance / match</b><div class="det">Les ${last.length} derniers pointages · <span class="p">■</span> séance <span style="color:var(--b)">■</span> match</div>
    <div class="chart">${last.map(e => { const x = evPct(e); return `<div title="${x.p}/${x.n}">${x.pct}%<i class="${e.type}" style="height:${Math.max(x.pct, 3)}%"></i></div>`; }).join('')}</div>
    <div class="xl">${last.map(e => `<span>${+e.date.slice(8)}/${+e.date.slice(5, 7)}</span>`).join('')}</div></div>`;
  const J = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  const byDay = {};
  se.forEach(e => { const d = (parse(e.date).getDay() + 6) % 7; (byDay[d] = byDay[d] || []).push(evPct(e).pct); });
  const ks = Object.keys(byDay).sort();
  if (ks.length) h += `<div class="card"><b>Présence selon le jour d'entraînement</b>${ks.map(d => { const v = avg(byDay[d]); return `<div class="hrow"><span>${J[d]}</span><div class="bar2"><i style="width:${v}%;background:${col(v)}"></i></div><b>${v}%</b></div>`; }).join('')}</div>`;
  const rows = S.players.map(p => ({ p, ...stats(p.id) })).filter(r => r.pct !== null);
  if (rows.length) {
    const top = [...rows].sort((a, b) => b.pct - a.pct).slice(0, 3);
    const low = rows.filter(r => r.pct < 70).sort((a, b) => a.pct - b.pct).slice(0, 5);
    h += `<div class="card"><b>⭐ Les plus assidus</b>${top.map(r => `<div class="hist st" data-act="openPl" data-id="${r.p.id}"><span>${esc(r.p.name)}</span><b class="${cls(r.pct)}">${r.pct}%</b></div>`).join('')}
      ${low.length ? `<div style="margin-top:12px"><b>⚠️ À surveiller (moins de 70 %)</b></div>${low.map(r => `<div class="hist st" data-act="openPl" data-id="${r.p.id}"><span>${esc(r.p.name)} <small class="n">${r.abs} abs.</small></span><b class="${cls(r.pct)}">${r.pct}%</b></div>`).join('')}` : ''}</div>`;
  }
  if (teams.length) h += `<div class="card"><b>Résultats</b>${teams.slice().reverse().map(({ e, t }) => `<div class="hist st" data-act="openEv" data-id="${e.id}"><span>${cap(fmtShort(e.date))} · ${esc(t.adv || 'adversaire')}${t.buts ? `<br><small class="n">⚽ ${esc(t.buts)}</small>` : ''}</span><span class="res ${result(t)}">${t.bp}-${t.bc}</span></div>`).join('')}</div>`;
  if (!pointed.length && !teams.length) h += '<p class="empty">Les statistiques apparaîtront dès que tu auras pointé des séances ou rentré des scores.</p>';
  return h;
}

const lst = a => a.length ? a.map(n => '• ' + n).join('\n') : '—';
function rapport(e) {
  const list = roster(e), by = s => list.filter(p => (e.presence[p.id] || 'N') === s).map(p => p.name);
  const P = by('P'), A = by('A'), E = by('E'), N = by('N');
  let r = `📋 FEUILLE DE PRÉSENCE – ${clubName()}\n${e.type === 'match' ? '⚽ Match' : '🏃 Séance'} du ${cap(fmtDate(e.date))}`;
  if (e.type !== 'match') r += (e.time ? ` – ${hh(e.time)}${e.end ? '-' + hh(e.end) : ''}` : '') + (e.lieu ? `\n📍 ${e.lieu}` : '');
  else (e.teams || []).forEach(t => {
    r += `\n${t.name ? t.name + ' ' : ''}${t.edu ? '(éduc : ' + t.edu + ') ' : ''}vs ${t.adv || 'adversaire'}${t.lieu ? ' @ ' + t.lieu : ''}${hasScore(t) ? ` : ${t.bp}-${t.bc}` : ''}${t.buts ? ` (buts : ${t.buts})` : ''}`;
  });
  r += `\n\n✅ Présents : ${P.length} / ${list.length}\n${lst(P)}\n\n❌ Absents : ${A.length}\n${lst(A)}\n\n🟠 Excusés : ${E.length}\n${lst(E)}`;
  if (N.length) r += `\n\n❔ Non pointés : ${N.join(', ')}`;
  if (e.cr) r += `\n\n📝 Compte rendu :\n${e.cr.trim()}`;
  if (e.com) r += `\n\n💬 Commentaire :\n${e.com.trim()}`;
  if (S.settings.sig) r += `\n\n${S.settings.sig}`;
  return r;
}
function bilan() {
  const evs = S.events.filter(e => !view.since || e.date >= view.since);
  const pointed = evs.filter(e => Object.keys(e.presence).length);
  const se = pointed.filter(e => e.type === 'seance'), ma = pointed.filter(e => e.type === 'match');
  const pS = avg(se.map(e => evPct(e).pct)), pM = avg(ma.map(e => evPct(e).pct));
  const R = { V: 0, N: 0, D: 0 }; let bp = 0, bc = 0;
  evs.filter(e => e.type === 'match').forEach(e => (e.teams || []).filter(hasScore).forEach(t => { R[result(t)]++; bp += +t.bp; bc += +t.bc; }));
  let r = `📊 BILAN DE PRÉSENCE – ${clubName()}\n${view.since ? 'Depuis le ' + fmtDate(view.since) : 'Toute la saison'} (au ${fmtDate(TODAY)})\n\n`;

  if (R.V + R.N + R.D) r += `🏆 Bilan : ${R.V} V – ${R.N} N – ${R.D} D (buts ${bp} / ${bc})\n`;
  r += `\n👥 Par joueur (${S.players.length}) :\n` + S.players.map(p => { const s = stats(p.id); return `• ${p.name} : ${s.pct === null ? '–' : s.pct + ' %'} (${s.s[0] + s.m[0]}/${s.s[1] + s.m[1]})${s.abs ? ' – ' + s.abs + ' abs.' : ''}${s.exc ? ' – ' + s.exc + ' exc.' : ''}`; }).join('\n');

  if (S.settings.sig) r += `\n\n${S.settings.sig}`;

}

  else if (k === 't') { const t = team(a); t[b] = v; const m = document.getElementById('msg-' + t.id); if (m) m.value = msg(curEv(), t); }
  else if (k === 'pl') { player(a)[b] = v; if (b === 'name') S.players.sort((x, y) => x.name.localeCompare(y.name, 'fr')); }
  else if (k === 'set') S.settings[a] = v;
  else if (k === 'bulk') { view.bulk[a] = v; return; }

});

      c.width = c.height = n; const x = c.getContext('2d');
      x.drawImage(img, (n - img.width * r) / 2, (n - img.height * r) / 2, img.width * r, img.height * r);
      S.settings.logo = c.toDataURL('image/png'); save(); render(); toast('Logo enregistré ✔');
    };
    img.src = URL.createObjectURL(el.files[0]);
  }
  if (el.id === 'imp' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const d = JSON.parse(r.result); if (!d.players || !d.events) throw 0; if (confirm('Remplacer les données actuelles par cette sauvegarde ?')) { S = d; save(); render(); toast('Sauvegarde importée ✔'); } }
      catch (e) { alert('Fichier invalide'); }
    };
    r.readAsText(el.files[0]);
  }
});
render();
</script>
</body>
</html>
